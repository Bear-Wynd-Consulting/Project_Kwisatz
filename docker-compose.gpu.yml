version: "3.9"

# =============================================================================
# GPU override — extend the base compose file with NVIDIA GPU support.
#
# Requirements:
#   - NVIDIA Container Toolkit installed on the host
#   - NVIDIA driver >= 525
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# =============================================================================

services:
  ollama:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # GPU inference uses far less RAM than CPU — adjust limit as needed
    mem_limit: 8g
    memswap_limit: 8g
