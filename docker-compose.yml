# =============================================================================
# Project_Kwisatz — Ollama + API Gateway (CPU mode)
#
# Usage:
#   docker compose up --build
#
# GPU mode (requires NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# First run will download the model — this can take several minutes.
# =============================================================================

networks:
  # Ollama ↔ gateway only — no host ports, no inbound from internet
  kwisatz-internal:
    internal: true
  # Gateway ↔ nginx only — no host ports, no inbound from internet
  kwisatz-public:
    internal: true
  # nginx is the only container reachable from the host / internet
  kwisatz-edge:
  # Outbound-only internet access for ollama (model pulls from registry)
  # Not internal, no ports published — Docker NAT gives egress only
  kwisatz-outbound:

volumes:
  ollama-models:
    # Persists the downloaded model across container rebuilds

services:
  # ---------------------------------------------------------------------------
  ollama:
    image: wynderoem/kwisatz-ollama
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: kwisatz-ollama
    env_file: .env
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - kwisatz-internal   # gateway can reach ollama here
      - kwisatz-outbound   # ollama can reach registry.ollama.ai for model pulls
    # NOT mapped to host ports — only reachable via kwisatz-internal
    expose:
      - "11434"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 20g
    memswap_limit: 20g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s  # Allow time for model pull on first start

  # ---------------------------------------------------------------------------
  gateway:
    image: wynderoem/kwisatz-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kwisatz-gateway
    env_file: .env
    networks:
      - kwisatz-internal
      - kwisatz-public
    # No host port mapping — all traffic enters via nginx
    expose:
      - "8000"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    memswap_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: kwisatz-nginx
    networks:
      - kwisatz-public
      - kwisatz-edge
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # set up cache directory ownership
      - SETUID         # drop to nginx worker user
      - SETGID         # drop to nginx worker group
      - NET_BIND_SERVICE  # bind port 80 (privileged port)
    mem_limit: 64m
    memswap_limit: 64m
